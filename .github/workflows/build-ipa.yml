name: Build IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: FocusFlip
  BUNDLE_ID: com.focusflip.app
  APP_VERSION: "1.0.0"

jobs:
  build:
    name: Build TrollStore IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_15.3.app 2>/dev/null || true
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          chmod +x Scripts/gen-xcodeproj.sh
          ./Scripts/gen-xcodeproj.sh

      - name: Build archive (no code signing)
        run: |
          xcodebuild archive \
            -project FocusFlip.xcodeproj \
            -scheme FocusFlip \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FocusFlip.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Install ldid
        run: brew install ldid

      - name: Package IPA
        run: |
          chmod +x Scripts/package-ipa.sh
          ./Scripts/package-ipa.sh build/FocusFlip.xcarchive

      - name: Verify IPA
        run: |
          echo "=== IPA contents ==="
          unzip -l build/*.ipa | head -20
          echo ""
          echo "=== File size ==="
          ls -lh build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlip-${{ env.APP_VERSION }}-ipa
          path: build/*.ipa
          retention-days: 90
          compression-level: 0

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
