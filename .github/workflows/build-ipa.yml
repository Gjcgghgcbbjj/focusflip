name: Build IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_NAME: FocusFlip
  BUNDLE_ID: com.focusflip.app
  APP_VERSION: "1.0.0"

jobs:
  build:
    name: Build TrollStore IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications/Xcode*.app
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || true
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          chmod +x Scripts/gen-xcodeproj.sh
          ./Scripts/gen-xcodeproj.sh

      - name: Build archive (no code signing)
        run: |
          xcodebuild archive \
            -project FocusFlip.xcodeproj \
            -scheme FocusFlip \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FocusFlip.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project FocusFlip.xcodeproj \
            -scheme FocusFlip \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Launch test in Simulator (smoke test)
        run: |
          set -x
          # Find the simulator build
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "FocusFlip.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "Simulator app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: simulator app not found"
            exit 1
          fi
          # Pick an available iPhone simulator
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
            import json,sys
            data=json.load(sys.stdin)
            for k,v in data['devices'].items():
                for d in v:
                    if d['isAvailable'] and 'iPhone' in d['name']:
                        print(d['udid']); sys.exit()
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          # Launch and check it stays alive
          xcrun simctl launch "$DEVICE" com.focusflip.app
          sleep 5
          # Verify process is still running (didn't crash)
          PID=$(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -i focusflip | awk '{print $1}')
          if [ -n "$PID" ] && [ "$PID" != "-" ]; then
            echo "✅ App launched and still running (PID: $PID)"
          else
            echo "❌ App CRASHED - process not running after launch"
            # Try to get crash log
            xcrun simctl spawn "$DEVICE" log show --last 1m --predicate 'process == "FocusFlip"' 2>/dev/null | tail -30 || true
            exit 1
          fi
          # Screenshot for evidence
          xcrun simctl io "$DEVICE" screenshot build/simulator-launch.png 2>/dev/null || true
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

      - name: Install ldid
        run: brew install ldid

      - name: Package IPA
        run: |
          chmod +x Scripts/package-ipa.sh
          ./Scripts/package-ipa.sh build/FocusFlip.xcarchive

      - name: Verify IPA
        run: |
          echo "=== IPA contents ==="
          unzip -l build/*.ipa | head -20
          echo ""
          echo "=== File size ==="
          ls -lh build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlip-${{ env.APP_VERSION }}-ipa
          path: build/*.ipa
          retention-days: 90
          compression-level: 0

      - name: Upload Simulator Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-launch-screenshot
          path: build/simulator-launch.png
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
