name: Build IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Needed so the "Create Release on tag" step can publish a GitHub Release
# (the default GITHUB_TOKEN is read-only unless granted here).
permissions:
  contents: write

env:
  APP_NAME: FocusFlip
  BUNDLE_ID: com.focusflip.app
  APP_VERSION: "3.7.0"

jobs:
  build:
    name: Build TrollStore IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (must have a matching simulator runtime)
        run: |
          set -e
          echo "=== Installed Xcode versions ==="
          ls -d /Applications/Xcode*.app
          echo ""
          echo "=== Installed Simulator Runtimes ==="
          xcrun simctl list runtimes 2>/dev/null || true
          echo ""
          # Why dynamic selection: on macos-15 images the pre-installed simulator
          # runtimes only match the newer Xcode releases (e.g. iOS 26.x runtimes
          # for Xcode 26.x). Building with Xcode 16.x fails in actool with
          # "No simulator runtime version ... available to use with
          # iphonesimulator SDK version ..." once the asset catalog contains an
          # app icon. So probe each Xcode (newest first) and pick the first one
          # whose actool can compile the asset catalog, i.e. has a usable runtime.
          SELECTED=""
          for X in $(ls -d /Applications/Xcode*.app | sort -V -r); do
            echo "--- Probing $X ---"
            sudo xcode-select -s "$X" 2>/dev/null || continue
            mkdir -p "$RUNNER_TEMP/actool-probe"
            if xcodebuild -version >/dev/null 2>&1 && \
               xcrun actool --output-format human-readable-text \
                 --minimum-deployment-target 15.0 --platform iphoneos \
                 --target-device iphone --app-icon AppIcon \
                 --compile "$RUNNER_TEMP/actool-probe" Resources/Assets.xcassets \
                 >/tmp/actool.log 2>&1; then
              echo "✅ Selected: $X"
              SELECTED="$X"
              break
            else
              echo "⚠️ actool probe failed (no usable simulator runtime for this SDK):"
              tail -2 /tmp/actool.log 2>/dev/null || true
            fi
          done
          if [ -z "$SELECTED" ]; then
            echo "!! No Xcode passed the probe; falling back to newest installed."
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V -r | head -1)"
          fi
          echo ""
          echo "=== Final toolchain ==="
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          chmod +x Scripts/gen-xcodeproj.sh
          ./Scripts/gen-xcodeproj.sh

      - name: Build archive (no code signing)
        run: |
          xcodebuild archive \
            -project FocusFlip.xcodeproj \
            -scheme FocusFlip \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/FocusFlip.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Build for Simulator
        run: |
          xcodebuild build \
            -project FocusFlip.xcodeproj \
            -scheme FocusFlip \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0

      - name: Launch test in Simulator (smoke test)
        run: |
          set -x
          # Find the simulator build
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "FocusFlip.app" -path "*Debug-iphonesimulator*" | head -1)
          echo "Simulator app: $APP"
          if [ -z "$APP" ]; then
            echo "ERROR: simulator app not found"
            exit 1
          fi
          # Pick an available iPhone simulator, preferring the NEWEST iOS runtime
          # (most likely to match the SDK of the Xcode selected above).
          # Note: simctl -j runtime keys differ across Xcode versions, e.g.
          #   "iOS 26.2" or "com.apple.CoreSimulator.SimRuntime.iOS-26-2"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
            import json,sys,re
            data=json.load(sys.stdin)
            def ver(runtime):
                m=re.search(r'[iI][oO][sS][\s\-_]*(\d+)(?:[.\-](\d+))?', runtime)
                return (int(m.group(1)), int(m.group(2) or 0)) if m else (-1,-1)
            best=None
            for runtime,devices in data['devices'].items():
                if 'iOS' not in runtime:
                    continue
                for d in devices:
                    if d.get('isAvailable') and 'iPhone' in d.get('name',''):
                        if best is None or ver(runtime) > ver(best[0]):
                            best=(runtime,d)
            if best is None:
                print('NO iOS iPhone device found. Runtime keys: ' + ','.join(data['devices'].keys()), file=sys.stderr)
                sys.exit(2)
            print(best[1]['udid'])
          ")
          echo "Device: $DEVICE"
          xcrun simctl boot "$DEVICE" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          # Launch and check it stays alive
          LAUNCH_OUT=$(xcrun simctl launch "$DEVICE" com.focusflip.app 2>&1)
          echo "Launch output: $LAUNCH_OUT"
          # First launch after cold boot can be slow (SpringBoard warm-up)
          sleep 10
          # Verify process is still running (didn't crash) via launchctl inside sim
          PID=$(xcrun simctl spawn "$DEVICE" launchctl list 2>/dev/null | grep -i "UIKitApplication:com.focusflip.app" | awk '{print $1}' | head -1)
          if [ -n "$PID" ] && [ "$PID" != "-" ]; then
            echo "✅ App launched and still running (PID: $PID)"
          else
            echo "❌ App CRASHED - process not running after launch"
            # Try to get crash log
            xcrun simctl spawn "$DEVICE" log show --last 1m --predicate 'process == "FocusFlip"' 2>/dev/null | tail -30 || true
            exit 1
          fi
          # Screenshot for evidence
          xcrun simctl io "$DEVICE" screenshot build/simulator-launch.png 2>/dev/null || true
          xcrun simctl shutdown "$DEVICE" 2>/dev/null || true

      - name: Package IPA
        run: |
          chmod +x Scripts/package-ipa.sh
          APP_VERSION="${{ env.APP_VERSION }}" ./Scripts/package-ipa.sh build/FocusFlip.xcarchive

      - name: Verify IPA
        run: |
          echo "=== IPA contents ==="
          unzip -l build/*.ipa | head -20
          echo ""
          echo "=== File size ==="
          ls -lh build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlip-${{ env.APP_VERSION }}-ipa
          path: build/*.ipa
          retention-days: 90
          compression-level: 0

      - name: Upload Simulator Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-launch-screenshot
          path: build/simulator-launch.png
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
