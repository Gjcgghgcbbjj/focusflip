name: FocusFlip
options:
  bundleIdPrefix: com.focusflip
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "15"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  FocusFlip:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusflip.app
        INFOPLIST_FILE: FocusFlip.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FocusFlip.entitlements
        PRODUCT_NAME: FocusFlip
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-ObjC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: CoreData.framework
      - sdk: AVFoundation.framework
      - sdk: UserNotifications.framework

